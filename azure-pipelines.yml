trigger:
- main

pool:
  name: gaurav
stages:
  - stage: Build
    jobs:
      - job: Buildpipeline
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Module'
            backendServiceArm: 'ServiceV3'
            backendAzureRmStorageAccountName: 'storageaccountnewgauravs'
            backendAzureRmContainerName: 'containergaurav'
            backendAzureRmKey: 'Terraformvar'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'ServiceV3'
